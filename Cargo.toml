# Virtual workspace — forge-crm is a domain/app WORKSPACE, not one crate.
#
# The app (`apps/crm`) is purely declarative and compiles to zero wasm: its
# pages and components are walked by forge-web's workspace compiler at build
# time and shipped as manifest rows, which is what retired the root `build.rs`
# that used to walk them into `OUT_DIR` codegen (HS-10).
#
# The only Rust here is the domain module, and its op bodies are not Rust
# either: `domains/crm/services/*.java` are dialect sources and
# `domains/crm/services/jgen` is their emitted Rust, committed so a plain
# `cargo build` needs no transpiler on the machine.
[workspace]
members = ["domains/crm"]
resolver = "2"
