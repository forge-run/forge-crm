[package]
name = "forge-domain-crm"
version = "0.1.0"
edition = "2021"
publish = false
description = "The CRM bounded context — the ops the app's pages bind to. The application itself is declarative: schemas/ here, pages + components under apps/crm."

[lib]
# `cdylib` is the deploy artifact (wasm32-wasip1 → Component Model).
# `rlib` lets `cargo test` link host-side without the Component symbols.
crate-type = ["cdylib", "rlib"]
# The MIXED-domain shape (forge-cli's `dialect::emit`): a hand-written
# `services/lib.rs` hosting an emitted `services/jgen`. This domain is mixed
# because of `services/seed.rs` — the demo-workspace bootstrap, which is not
# an op and which the dialect cannot express (no `try`, no `tenant_id`).
path = "services/lib.rs"

[dependencies]
# The Forge SDK — the Guest export macro, OpContext, and storage::query/mutate.
#
# These are PATH deps to the sibling Forge crates (monorepo layout: forge-crm
# lives beside forge-sdk-v2 / forge-lang under the same parent).
# For a standalone fork OUTSIDE the monorepo, point them at the published
# crates (crates.io) or a git dependency, e.g.:
#   forge-sdk-v2 = { git = "https://github.com/forge-run/forge-sdk", tag = "v2" }
forge-sdk-v2 = { path = "../../../forge-sdk-v2" }
# The dialect runtime the emitted `services/jgen` module links. The 22 ops in
# `services/*.java` are this domain's operations layer; `jgen` is their emitted
# Rust, regenerated with
#   forge-lang build domains/crm/services/*.java \
#     --module-out domains/crm/services/jgen --source-root .
# and COMMITTED.
forge-lang-rt = { path = "../../../forge-lang/crates/forge-lang-rt", features = ["sdk"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
